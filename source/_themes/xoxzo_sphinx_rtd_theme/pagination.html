{% if (theme_prev_next_buttons_location == 'bottom' or theme_prev_next_buttons_location == 'both') and (next or prev) %}
  <div class="rst-footer-buttons" role="navigation" aria-label="footer navigation">
    {% if next %}
      <a href="{{ next.link|e }}" class="btn btn-point float-right" title="{{ next.title|striptags|e }}" accesskey="n">{{ _('Next') }} <span class="fa fa-arrow-circle-right"></span></a>
    {% endif %}
    {% if prev %}
      <a href="{{ prev.link|e }}" class="btn btn-point" title="{{ prev.title|striptags|e }}" accesskey="p"><span class="fa fa-arrow-circle-left"></span> {{ _('Previous') }}</a>
    {% endif %}
  </div>
{% endif %}
